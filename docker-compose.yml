# Ejecución local reproducible:  docker compose up --build
services:
  visionq:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
    image: visionq:2.0.0
    container_name: visionq
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      VISIONQ_ENVIRONMENT: local-compose
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
